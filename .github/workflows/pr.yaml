# Pull request validation: runs make check on GitHub-hosted runner.
# Never runs on self-hosted runners to prevent untrusted code execution from fork PRs.
name: pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false
      - uses: astral-sh/setup-uv@v10.2.0
      - run: make check
