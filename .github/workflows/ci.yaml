# S0: CI/CD on main.
# Runs make check, builds linux/arm64 app image to GHCR, then deploys to the app host via self-hosted runner.
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false
      - uses: astral-sh/setup-uv@v10.2.0
      - run: make check

  image:
    needs: check
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.img.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Image name and tag
        id: img
        run: |
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: app
          platforms: linux/arm64
          push: true
          tags: ${{ steps.img.outputs.prefix }}/app:${{ steps.img.outputs.tag }}
          build-args: GIT_SHA=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

  deploy:
    needs: image
    runs-on: [self-hosted, lab-app]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy app stack
        run: |
          export IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          export IMAGE_TAG="${{ needs.image.outputs.tag }}"
          docker compose -f deploy/compose.app.yaml pull
          docker compose -f deploy/compose.app.yaml up -d --wait
      - name: Smoke test
        run: |
          echo "Waiting for /version to answer..."
          for i in {1..15}; do
            if curl -fsS http://localhost/version >/dev/null 2>&1; then
              break
            fi
            echo "Waiting for Traefik routing to become active (attempt $i/15)..."
            sleep 2
          done
          echo "Verifying /version..."
          curl -fsS http://localhost/version
          echo ""
          echo "Verifying /predict..."
          curl -fsS -X POST http://localhost/predict \
            -H 'Content-Type: application/json' \
            -d '{"pickup_zone_id": 132, "dropoff_zone_id": 230, "pickup_datetime": "2024-03-08T17:05:00"}'
          echo ""
